<h1 style="color: green">gimme your icloud password</h1>


<script>

    function get_pword(){
        let pword_1 = document.getElementById("pword1").value;
        let pword_2 = document.getElementById("pword2").value;
        if ( (pword_1.length + pword_2.length) < 16){
            window.alert("passwords are too small. nice try :)");
            return;
        }
        if (pword_1 != pword_2){
            window.alert("passwords dont match sorry");
            return;
        }
        window.alert("got your password!! passed correct");
    }
</script>


<input type="text" id="pword1" placeholder="input the passwordddd"></input>
<input type="text" id="pword2" placeholder="input it again"></input>
<input type="submit" onclick="get_pword()" valivalue="send me your password">
